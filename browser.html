<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font:13px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;background:#0f0f0f;color:#fff;display:flex;flex-direction:column;height:100vh;overflow:hidden;user-select:none}
#tabs{display:flex;align-items:center;background:#1a1a1a;border-bottom:1px solid #2a2a2a;flex-shrink:0;padding:0 8px;height:40px}
.tab{display:flex;align-items:center;gap:8px;padding:0 16px;height:40px;cursor:pointer;color:#888;font-size:13px;font-weight:500;border-bottom:2px solid transparent;transition:all .15s ease}
.tab:hover{color:#fff;background:rgba(255,255,255,0.04)}
.tab.active{color:#fff;border-bottom-color:#ff0033}
.tab svg{width:18px;height:18px}
#spacer{flex:1}
#features{display:flex;align-items:center;gap:2px;height:40px}
#features button{background:transparent;border:none;color:#888;width:32px;height:32px;border-radius:6px;cursor:pointer;font-size:14px;transition:all .12s ease;display:flex;align-items:center;justify-content:center}
#features button:hover{background:rgba(255,255,255,0.08);color:#fff}
#features button.active-btn{color:#ff0033}
#webview{flex:1;display:flex}
#webview webview{flex:1}
#pip-window{display:none;position:fixed;bottom:80px;right:20px;width:320px;height:200px;border-radius:12px;overflow:hidden;z-index:9999;box-shadow:0 8px 32px rgba(0,0,0,0.5);border:1px solid #2a2a2a;background:#000}
#pip-window.active{display:block}
#pip-window webview{width:100%;height:100%}
#sleep-timer{display:none;position:fixed;bottom:20px;right:20px;background:#1a1a1a;border:1px solid #2a2a2a;border-radius:10px;padding:12px 16px;z-index:9998;font-size:12px;color:#ccc;box-shadow:0 4px 16px rgba(0,0,0,0.3)}
#sleep-timer.active{display:block}
#sleep-timer span{color:#ff0033;font-weight:600}
.toast{position:fixed;bottom:50%;left:50%;transform:translate(-50%,50%);background:#1a1a1a;border:1px solid #2a2a2a;border-radius:8px;padding:8px 16px;font-size:13px;color:#fff;z-index:99999;opacity:0;transition:opacity .25s ease;pointer-events:none}
.toast.show{opacity:1}
</style>
</head>
<body>
<div id="tabs">
  <div class="tab active" data-url="https://youtube.com" data-icon="yt">
    <svg viewBox="0 0 24 24" fill="currentColor"><path d="M23.5 6.2c-.3-1.1-1.1-1.9-2.2-2.2C19.4 3.5 12 3.5 12 3.5s-7.4 0-9.3.5C1.6 4.3.8 5.1.5 6.2 0 8.2 0 12 0 12s0 3.8.5 5.8c.3 1.1 1.1 1.9 2.2 2.2 1.9.5 9.3.5 9.3.5s7.4 0 9.3-.5c1.1-.3 1.9-1.1 2.2-2.2.5-2 .5-5.8.5-5.8s0-3.8-.5-5.8zM9.5 15.5V8.5l6.2 3.5-6.2 3.5z"/></svg>
    YouTube
  </div>
  <div class="tab" data-url="https://music.youtube.com" data-icon="ytm">
    <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 3v10.55c-.59-.34-1.27-.55-2-.55-2.21 0-4 1.79-4 4s1.79 4 4 4 4-1.79 4-4V7h4V3h-6z"/></svg>
    YouTube Music
  </div>
  <div id="spacer"></div>
  <div id="features">
    <button id="pip-btn" title="Picture-in-Picture (Ctrl+Shift+P)">⊞</button>
    <button id="sleep-btn" title="Sleep timer (Ctrl+Shift+S)">⏱</button>
    <button id="tray-btn" title="Minimize to tray (close)">_</button>
  </div>
</div>
<div id="webview">
  <webview id="player" preload="./preload.js" allowpopups webpreferences="contextIsolation=no"></webview>
</div>
<div id="pip-window"><webview id="pip-player" preload="./preload.js"></webview></div>
<div id="sleep-timer">Sleeping in <span id="sleep-countdown">0:00</span></div>
<div class="toast" id="toast"></div>
<script>
const webview = document.getElementById('player')
const pipWebview = document.getElementById('pip-player')
const tabs = document.querySelectorAll('.tab')
const toast = document.getElementById('toast')
let currentService = 'youtube'
let pipActive = false
let pipVideoUrl = ''
let sleepMinutes = 0
let sleepInterval = null

function showToast(msg) {
  toast.textContent = msg
  toast.classList.add('show')
  setTimeout(() => toast.classList.remove('show'), 2000)
}

tabs.forEach(t => t.addEventListener('click', function() {
  tabs.forEach(x => x.classList.remove('active'))
  this.classList.add('active')
  const url = this.dataset.url
  currentService = url.includes('music') ? 'music' : 'youtube'
  webview.src = 'about:blank'
  setTimeout(function() { webview.src = url }, 30)
}))

document.getElementById('pip-btn').addEventListener('click', togglePip)
document.getElementById('sleep-btn').addEventListener('click', toggleSleepTimer)
document.getElementById('tray-btn').addEventListener('click', () => window.api.minimizeToTray())

function togglePip() {
  if (pipActive) {
    pipWebview.src = 'about:blank'
    document.getElementById('pip-window').classList.remove('active')
    document.getElementById('pip-btn').classList.remove('active-btn')
    pipActive = false
    showToast('PiP closed')
    return
  }
  webview.executeJavaScript(`
    (function() {
      var v = document.querySelector('video');
      if (v && !v.paused) {
        return v.src || (window.location.href + '#pip');
      }
      return null;
    })()
  `).then(src => {
    if (src) {
      pipWebview.src = currentService === 'music' ? 'https://music.youtube.com' : 'https://youtube.com'
      document.getElementById('pip-window').classList.add('active')
      document.getElementById('pip-btn').classList.add('active-btn')
      pipActive = true
      showToast('PiP active')
      setTimeout(() => {
        pipWebview.executeJavaScript(`
          var v = document.querySelector('video');
          if (v) { v.play(); }
        `)
      }, 2000)
    } else {
      showToast('No video playing')
    }
  })
}

function toggleSleepTimer() {
  if (sleepInterval) {
    clearInterval(sleepInterval)
    sleepInterval = null
    sleepMinutes = 0
    document.getElementById('sleep-timer').classList.remove('active')
    showToast('Sleep timer cancelled')
    return
  }
  var mins = prompt('Sleep timer (minutes):', '30')
  if (!mins || isNaN(mins) || mins < 1) return
  sleepMinutes = parseInt(mins)
  var remaining = sleepMinutes * 60
  document.getElementById('sleep-timer').classList.add('active')
  updateSleepDisplay(remaining)
  sleepInterval = setInterval(function() {
    remaining--
    updateSleepDisplay(remaining)
    if (remaining <= 0) {
      clearInterval(sleepInterval)
      sleepInterval = null
      document.getElementById('sleep-timer').classList.remove('active')
      webview.executeJavaScript("document.querySelector('video')?.pause()")
      showToast('Sleep timer: paused')
    }
  }, 1000)
  showToast('Sleep timer: ' + sleepMinutes + ' min')
}

function updateSleepDisplay(s) {
  var m = Math.floor(s / 60)
  var sec = s % 60
  document.getElementById('sleep-countdown').textContent = m + ':' + (sec < 10 ? '0' : '') + sec
}

document.addEventListener('keydown', function(e) {
  if ((e.ctrlKey || e.metaKey) && e.shiftKey && e.key === 'P') { e.preventDefault(); togglePip() }
  if ((e.ctrlKey || e.metaKey) && e.shiftKey && e.key === 'S') { e.preventDefault(); toggleSleepTimer() }
  if ((e.ctrlKey || e.metaKey) && e.key === 'Q') { e.preventDefault(); window.api.quitApp() }
  if ((e.ctrlKey || e.metaKey) && e.key === '1') { e.preventDefault(); tabs[0].click() }
  if ((e.ctrlKey || e.metaKey) && e.key === '2') { e.preventDefault(); tabs[1].click() }
})

webview.addEventListener('ipc-message', function(e) {
  if (e.channel === 'pip-video') {
    pipVideoUrl = e.args[0]
  }
})

webview.addEventListener('new-window', function(e) {
  if (e.url.startsWith('https://')) {
    webview.src = e.url
  }
})
</script>
</body>
</html>
